<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск в числе π</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <div class="fixed">
            <h1>Поиск последовательности в числе π</h1>
            <input type="text" id="search-input" placeholder="Введите последовательность">
            <button type="button" onclick="searchSequence()">Найти</button>
            <div id="load-status" class="load-status" aria-live="polite"></div>
            <div id="result"></div>
        </div>
        <div id="pi-scroll" class="pi-scroll">
            <div id="pi-spacer"></div>
            <pre id="pi-digits"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
